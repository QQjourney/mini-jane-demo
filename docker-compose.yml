services:
  api:
    build: .
    image: mini-jane-demo:latest
    command: ["python","-m","uvicorn","app.api.main:app","--host","0.0.0.0","--port","8000"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CHROMA_PERSIST_DIR: /app/vectorstore
      COLLECTION_NAME: jenosize-ideas
      EMBED_MODEL: BAAI/bge-m3
      GENERATION_MODEL: ${GENERATION_MODEL:-models/gemini-2.5-flash}
      APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data:/app/data
    restart: unless-stopped

  ui:
    image: mini-jane-demo:latest
    depends_on:
      - api
    command: ["streamlit","run","app/ui/streamlit_app.py","--server.port","8501","--server.address","0.0.0.0"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CHROMA_PERSIST_DIR: /app/vectorstore
      COLLECTION_NAME: jenosize-ideas
      EMBED_MODEL: BAAI/bge-m3
      GENERATION_MODEL: ${GENERATION_MODEL:-models/gemini-2.5-flash}
    ports:
      - "8501:8501"
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data:/app/data